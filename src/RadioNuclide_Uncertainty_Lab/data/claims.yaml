checks:
  # ---------------- internal consistency of a source ----------------
  - id: staanum.quadrature_3spect
    kind: quadrature
    terms: [staanum2021.t2.dose_calibrator_calibration, staanum2021.t2.dose_calibrator_stability,
            staanum2021.t2.scanner_sensitivity, staanum2021.t2.scanner_deadtime_constant,
            staanum2021.t2.reproduction, staanum2021.t2.scanner_stability, staanum2021.t2.deadtime_correction,
            staanum2021.t2.delineation, staanum2021.t2.pvc, staanum2021.t2.exp_model_early,
            staanum2021.t2.exp_model_late, staanum2021.fig6b.auc, staanum2021.t2.dose_factor_gamma,
            staanum2021.t2.dose_factor_density]
    total: staanum2021.t2.total_3spect
    mode: up           # the paper rounds each term up, so the printed total >= the exact quadrature
    tol: 1.0           # percentage points
    expect: pass
    note: "Table 2 terms add in quadrature to 12.1 %; the paper prints 13 % (rounded up)."

  - id: staanum.fig6b_correlation
    kind: agree
    a: staanum2021.derived.rho_c0_teff
    b: {expr: "-(staanum2021.fig6b.c0**2 + staanum2021.fig6b.lambda**2 - staanum2021.fig6b.auc**2) / (2*staanum2021.fig6b.c0*staanum2021.fig6b.lambda)"}
    abs_tol: 0.01
    expect: pass
    note: "r(C0, lambda) implied by the three Fig. 6b uncertainties; T_eff = ln2/lambda flips the sign."

  - id: staanum.fig6b_correlation_is_valid
    kind: bound
    value: {expr: "(staanum2021.fig6b.c0**2 + staanum2021.fig6b.lambda**2 - staanum2021.fig6b.auc**2) / (2*staanum2021.fig6b.c0*staanum2021.fig6b.lambda)"}
    lo: -1
    hi: 1
    expect: pass

  - id: staanum.abstract_vs_results.dotatoc_mean
    kind: agree
    a: staanum2021.dotatoc.specific_dose.mean.abstract
    b: staanum2021.dotatoc.specific_dose.mean.results
    rel_tol: 0.01
    expect: conflict
    exclude: [staanum2021.dotatoc.specific_dose.mean.abstract, staanum2021.dotatoc.specific_dose.mean.results]
    note: "Abstract and Results swap the DOTATOC mean and median (0.37/0.38 versus 0.38/0.37)."

  - id: staanum.abstract_vs_results.dotatoc_median
    kind: agree
    a: staanum2021.dotatoc.specific_dose.median.abstract
    b: staanum2021.dotatoc.specific_dose.median.results
    rel_tol: 0.01
    expect: conflict
    exclude: [staanum2021.dotatoc.specific_dose.median.abstract, staanum2021.dotatoc.specific_dose.median.results]
    note: "Same swap as above, median reading."

  - id: staanum.one_spect_lambda_uncertainty
    kind: agree
    a: staanum2021.one_spect.lambda_unc.text
    b: staanum2021.one_spect.lambda_unc.table2
    rel_tol: 0.05
    expect: conflict
    exclude: [staanum2021.one_spect.lambda_unc.text, staanum2021.one_spect.lambda_unc.table2]
    note: "1-SPECT lambda uncertainty is 5.5 % in the text and 9 % in Table 2 footnote d."

  - id: gear.s_model_c2_uncertainty
    kind: agree
    a: gear2018.s_model.c2_unc_listed
    b: {expr: "100*gear2018.s_model.c2_unc/gear2018.s_model.c2"}
    rel_tol: 0.10
    expect: conflict
    exclude: [gear2018.s_model.c2_unc_listed]
    note: "Table 10 lists 1.2 % for c2 but 0.0051/0.961 = 0.53 %."

  - id: gear.s_model_c1_uncertainty
    kind: agree
    a: gear2018.s_model.c1_unc_listed
    b: {expr: "100*gear2018.s_model.c1_unc/gear2018.s_model.c1"}
    rel_tol: 0.10
    expect: conflict
    exclude: [gear2018.s_model.c1_unc_listed]
    note: "Table 10 lists 0.4 % for c1 but 0.0037/0.429 = 0.86 %. Both are ignored by the paper (<1 %)."

  - {id: gear.liver.nominal_dose, kind: agree, a: gear2018.liver.dose,
     b: {expr: "gear2018.liver.tia*gear2018.s_model.c1*gear2018.liver.mass**(-gear2018.s_model.c2)"}, rel_tol: 0.005, expect: pass}
  - {id: gear.pancreas.nominal_dose, kind: agree, a: gear2018.pancreas.dose,
     b: {expr: "gear2018.pancreas.tia*gear2018.s_model.c1*gear2018.pancreas.mass**(-gear2018.s_model.c2)"}, rel_tol: 0.005, expect: pass}
  - {id: gear.liver.s_uncertainty, kind: agree, a: gear2018.liver.s_rel_unc,
     b: {expr: "gear2018.s_model.c2*gear2018.liver.mass_rel_unc"}, rel_tol: 0.01, expect: pass}
  - {id: gear.pancreas.s_uncertainty, kind: agree, a: gear2018.pancreas.s_rel_unc,
     b: {expr: "gear2018.s_model.c2*gear2018.pancreas.mass_rel_unc"}, rel_tol: 0.01, expect: pass}
  - id: gear.liver.first_order_dose_uncertainty
    kind: agree
    a: gear2018.liver.dose_rel_unc
    b: {expr: "sqrt(gear2018.liver.tia_rel_unc**2 + gear2018.liver.s_rel_unc**2 + 2*gear2018.liver.r_tia_s*gear2018.liver.tia_rel_unc*gear2018.liver.s_rel_unc)"}
    rel_tol: 0.01
    expect: pass
  - id: gear.pancreas.first_order_dose_uncertainty
    kind: agree
    a: gear2018.pancreas.dose_rel_unc
    b: {expr: "sqrt(gear2018.pancreas.tia_rel_unc**2 + gear2018.pancreas.s_rel_unc**2 + 2*gear2018.pancreas.r_tia_s*gear2018.pancreas.tia_rel_unc*gear2018.pancreas.s_rel_unc)"}
    rel_tol: 0.01
    expect: pass
  - id: gear.fit_covariance_reproduces_fit_term
    kind: agree
    a: gear2018.fit.liver.tia_fit_unc
    b: {expr: "100*sqrt((1/gear2018.fit.liver.rate)**2*gear2018.fit.liver.var_a0 + (gear2018.fit.liver.a0/gear2018.fit.liver.rate**2)**2*gear2018.fit.liver.var_rate - 2*(1/gear2018.fit.liver.rate)*(gear2018.fit.liver.a0/gear2018.fit.liver.rate**2)*gear2018.fit.liver.cov_a0_rate)/(gear2018.fit.liver.a0/gear2018.fit.liver.rate)"}
    rel_tol: 0.03
    expect: pass
    note: "Delta method on the Table 8 covariance gives 14.9 % against the printed 15.1 %."
  - id: gear.fit_rate_uncertainty_consistent
    kind: agree
    a: gear2018.fit.liver.rate_unc
    b: {expr: "sqrt(gear2018.fit.liver.var_rate)"}
    rel_tol: 0.05
    expect: pass

  # ---------------- agreement between independent sources ----------------
  - {id: gleisner.mass_times_s.kidneys, kind: agree, a: gleisner2022.mass_times_s.kidneys,
     b: {expr: "gleisner2022.s_self.kidneys*gleisner2022.mass.kidneys/1000"}, rel_tol: 0.01, expect: pass}
  - {id: gleisner.mass_times_s.liver, kind: agree, a: gleisner2022.mass_times_s.liver,
     b: {expr: "gleisner2022.s_self.liver*gleisner2022.mass.liver/1000"}, rel_tol: 0.01, expect: pass}
  - {id: gleisner.mass_times_s.spleen, kind: agree, a: gleisner2022.mass_times_s.spleen,
     b: {expr: "gleisner2022.s_self.spleen*gleisner2022.mass.spleen/1000"}, rel_tol: 0.01, expect: pass}
  - {id: gleisner.mass_times_s.marrow, kind: agree, a: gleisner2022.mass_times_s.marrow,
     b: {expr: "gleisner2022.s_self.marrow*gleisner2022.mass.marrow/1000"}, rel_tol: 0.01, expect: pass}
  - {id: nuclide.delta_e_icrp107_vs_nndc, kind: agree, a: staanum2021.lu177.delta_e, b: staanum2021.lu177.delta_e_nndc,
     rel_tol: 0.015, expect: pass, note: "ICRP 107 and NNDC electron energies differ by ~1 %: a measure of nuclear-data uncertainty."}
  - {id: nuclide.delta_e_two_sources, kind: agree, a: staanum2021.lu177.delta_e, b: gleisner2022.delta_e, rel_tol: 0.001, expect: pass}
  - id: nuclide.half_life_staanum_vs_ddep
    kind: agree
    a: staanum2021.lu177.half_life
    b: ddep.lu177.half_life
    rel_tol: 0.001
    expect: pass
    note: "6.647 d (Staanum, an older DDEP evaluation) vs 6.6443(9) d (current DDEP): 0.04 %, immaterial, but the registry now holds the current value."
  - id: nuclide.half_life_within_older_uncertainty
    kind: bound
    value: staanum2021.lu177.half_life
    lo: {expr: "ddep.lu177.half_life - 5*ddep.lu177.half_life_unc"}
    hi: {expr: "ddep.lu177.half_life + 5*ddep.lu177.half_life_unc"}
    expect: pass
  - id: nuclide.delta_e_within_ddep_bounds
    kind: bound
    value: {expr: "1000*gleisner2022.delta_e"}
    lo: {expr: "(ddep.lu177.beta03.prob*ddep.lu177.beta03.avg + ddep.lu177.beta02.prob*ddep.lu177.beta02.avg + ddep.lu177.beta01.prob*ddep.lu177.beta01.avg + ddep.lu177.beta00.prob*ddep.lu177.beta00.avg)/100 + (ddep.lu177.auger_l.prob*ddep.lu177.auger_l.emin + ddep.lu177.auger_k.prob*ddep.lu177.auger_k.emin + ddep.lu177.ec32.prob*ddep.lu177.ec32.emin + ddep.lu177.ec10.prob*ddep.lu177.ec10.emin + ddep.lu177.ec21.prob*ddep.lu177.ec21.emin + ddep.lu177.ec31.prob*ddep.lu177.ec31.emin + ddep.lu177.ec20.prob*ddep.lu177.ec20.emin + ddep.lu177.ec30.prob*ddep.lu177.ec30.emin)/100"}
    hi: {expr: "(ddep.lu177.beta03.prob*ddep.lu177.beta03.avg + ddep.lu177.beta02.prob*ddep.lu177.beta02.avg + ddep.lu177.beta01.prob*ddep.lu177.beta01.avg + ddep.lu177.beta00.prob*ddep.lu177.beta00.avg)/100 + (ddep.lu177.auger_l.prob*ddep.lu177.auger_l.emax + ddep.lu177.auger_k.prob*ddep.lu177.auger_k.emax + ddep.lu177.ec32.prob*ddep.lu177.ec32.emax + ddep.lu177.ec10.prob*ddep.lu177.ec10.emax + ddep.lu177.ec21.prob*ddep.lu177.ec21.emax + ddep.lu177.ec31.prob*ddep.lu177.ec31.emax + ddep.lu177.ec20.prob*ddep.lu177.ec20.emax + ddep.lu177.ec30.prob*ddep.lu177.ec30.emax)/100"}
    expect: pass
    note: "ICRP 107 electron energy per decay (147.9 keV) must lie between the DDEP beta averages plus the minimum, and plus the maximum, conversion- and Auger-electron energy of each group."
  - id: nuclide.delta_e_nndc_within_ddep_bounds
    kind: bound
    value: {expr: "1000*staanum2021.lu177.delta_e_nndc"}
    lo: {expr: "(ddep.lu177.beta03.prob*ddep.lu177.beta03.avg + ddep.lu177.beta02.prob*ddep.lu177.beta02.avg + ddep.lu177.beta01.prob*ddep.lu177.beta01.avg + ddep.lu177.beta00.prob*ddep.lu177.beta00.avg)/100 + (ddep.lu177.auger_l.prob*ddep.lu177.auger_l.emin + ddep.lu177.auger_k.prob*ddep.lu177.auger_k.emin + ddep.lu177.ec32.prob*ddep.lu177.ec32.emin + ddep.lu177.ec10.prob*ddep.lu177.ec10.emin + ddep.lu177.ec21.prob*ddep.lu177.ec21.emin + ddep.lu177.ec31.prob*ddep.lu177.ec31.emin + ddep.lu177.ec20.prob*ddep.lu177.ec20.emin + ddep.lu177.ec30.prob*ddep.lu177.ec30.emin)/100"}
    hi: {expr: "(ddep.lu177.beta03.prob*ddep.lu177.beta03.avg + ddep.lu177.beta02.prob*ddep.lu177.beta02.avg + ddep.lu177.beta01.prob*ddep.lu177.beta01.avg + ddep.lu177.beta00.prob*ddep.lu177.beta00.avg)/100 + (ddep.lu177.auger_l.prob*ddep.lu177.auger_l.emax + ddep.lu177.auger_k.prob*ddep.lu177.auger_k.emax + ddep.lu177.ec32.prob*ddep.lu177.ec32.emax + ddep.lu177.ec10.prob*ddep.lu177.ec10.emax + ddep.lu177.ec21.prob*ddep.lu177.ec21.emax + ddep.lu177.ec31.prob*ddep.lu177.ec31.emax + ddep.lu177.ec20.prob*ddep.lu177.ec20.emax + ddep.lu177.ec30.prob*ddep.lu177.ec30.emax)/100"}
    expect: pass
  - {id: kidney_dose.staanum_vs_santoro, kind: agree, a: staanum2021.dotatate.specific_dose.mean,
     b: {expr: "santoro2018.dose.kidneys"}, rel_tol: 0.10, expect: pass,
     note: "Two independent cohorts; same quantity (kidney mean dose per activity, Gy/GBq == mGy/MBq)."}
  - {id: kidney_dose.cohort_spread, kind: spread, max_ratio: 1.6,
     values: [staanum2021.dotatate.specific_dose.mean, santoro2018.dose.kidneys, bodei2025.dose.kidneys], expect: pass,
     note: "Informational: cohort-to-cohort variability (0.43-0.65 Gy/GBq), not part of the measurement-uncertainty budget."}
  - {id: kidney_tiac.bodei_vs_derived, kind: spread, max_ratio: 1.5,
     values: [bodei2025.tiac.kidneys, {expr: "staanum2021.dotatate.specific_dose.mean/gleisner2022.s_self.kidneys"}], expect: pass,
     note: "Derived kidney TIA coefficient (D/A over S) against the independently reported mean."}

  - id: nuclides.registry_matches_claims
    kind: refdata
    name: nuclide_registry
    nuclide: Lu-177
    rel_tol: 1.0e-9
    fields:
      half_life_d: ddep.lu177.half_life
      half_life_unc_d: ddep.lu177.half_life_unc
      delta_e_mev: gleisner2022.delta_e
      delta_ph_mev: gleisner2022.delta_ph
      delta_e_alt_mev: staanum2021.lu177.delta_e_nndc
    expect: pass
    note: "nuclides.py must equal the registry of published numbers; this check would have caught the stale 6.647 d."

  # ---------------- reference datasets (physics + cross-database) ----------------
  - id: svalues.reciprocity
    kind: refdata
    name: reciprocity
    dataset: lu177_adult_male
    rel_tol: 0.05
    min_relative: 1.0e-3
    expect: pass
    note: "Specific absorbed fractions are symmetric: S(t<-s) = S(s<-t) up to Monte Carlo noise. Tested for cross terms >= 1e-3 of the self terms (smaller ones are noise-dominated: up to 13 % asymmetry at 1e-5, and below 0.1 % of any dose)."
  - id: svalues.reciprocity_scenario_organs
    kind: refdata
    name: reciprocity
    dataset: lu177_adult_male
    regions: [Kidneys, Liver, Spleen]
    rel_tol: 0.01
    expect: pass
    note: "The three organs the shipped scenario uses: symmetric to better than 1 % (the marrow pairs above are the noisy ones)."
  - id: svalues.energy_conservation
    kind: refdata
    name: energy_conservation
    dataset: lu177_adult_male
    expect: pass
    note: "The energy absorbed in the listed targets per MBq h of a source cannot exceed the energy emitted."
  - id: svalues.agree_with_idac_self_s
    kind: refdata
    name: matches_claims
    dataset: lu177_adult_male
    rel_tol: 0.01
    pairs:
      Kidneys: {s: gleisner2022.s_self.kidneys, mass: gleisner2022.mass.kidneys}
      Liver: {s: gleisner2022.s_self.liver, mass: gleisner2022.mass.liver}
      Spleen: {s: gleisner2022.s_self.spleen, mass: gleisner2022.mass.spleen}
      "Bone marrow - red (active)": {s: gleisner2022.s_self.marrow, mass: gleisner2022.mass.marrow}
    expect: pass
    note: "MIRDcalc (downloaded) against IDAC-Dose 2.1 (Gleisner Table 2): same phantom, independent codes."

  # ---- second, independent source for the CROSS-organ terms (female phantom, liver source) ----------
  # The male S-values used in the scenario have no independent cross-term table. The same MIRDcalc
  # pipeline (decay data, transport, regions) is therefore validated on the female phantom, where IDAC-Dose
  # 2.1 and OpenDose published Lu-177 values for a liver source (OpenDose 2020, Table 1).
  - id: svalues.female.cross_vs_idac
    kind: refdata
    name: matches_s_claims
    dataset: lu177_adult_female
    rel_tol: 0.01
    pairs:
      - {target: Brain,            source: Liver, claim: opendose2020.t1.lu177.brain.idac}
      - {target: Gallbladder wall, source: Liver, claim: opendose2020.t1.lu177.gallbladder_wall.idac}
      - {target: Liver,            source: Liver, claim: opendose2020.t1.lu177.liver.idac}
      - {target: Pancreas,         source: Liver, claim: opendose2020.t1.lu177.pancreas.idac}
      - {target: Spleen,           source: Liver, claim: opendose2020.t1.lu177.spleen.idac}
      - {target: Thyroid,          source: Liver, claim: opendose2020.t1.lu177.thyroid.idac}
    expect: pass
    note: "MIRDcalc vs IDAC-Dose 2.1, six targets spanning four orders of magnitude (also fixes the unprinted units)."
  - id: svalues.female.cross_vs_opendose
    kind: refdata
    name: matches_s_claims
    dataset: lu177_adult_female
    rel_tol: 0.01
    pairs:
      - {target: Brain,            source: Liver, claim: opendose2020.t1.lu177.brain.opendose}
      - {target: Gallbladder wall, source: Liver, claim: opendose2020.t1.lu177.gallbladder_wall.opendose}
      - {target: Pancreas,         source: Liver, claim: opendose2020.t1.lu177.pancreas.opendose}
      - {target: Spleen,           source: Liver, claim: opendose2020.t1.lu177.spleen.opendose}
      - {target: Thyroid,          source: Liver, claim: opendose2020.t1.lu177.thyroid.opendose}
    expect: pass
    note: "MIRDcalc vs OpenDose for the five cross terms (liver self term below)."
  - id: svalues.female.liver_self_vs_opendose
    kind: refdata
    name: matches_s_claims
    dataset: lu177_adult_female
    rel_tol: 0.05
    pairs:
      - {target: Liver, source: Liver, claim: opendose2020.t1.lu177.liver.opendose}
    expect: conflict
    exclude: [opendose2020.t1.lu177.liver.opendose]
    note: "OpenDose's liver SELF value is 29 % above MIRDcalc and IDAC-Dose; the paper attributes it to the mass adjustment made in the ICRP 133 SAFs. Self terms only; cross terms agree to 0.5 %."
  - id: svalues.female.reciprocity
    kind: refdata
    name: reciprocity
    dataset: lu177_adult_female
    rel_tol: 0.05
    min_relative: 1.0e-3
    expect: pass
  - id: svalues.female.energy_conservation
    kind: refdata
    name: energy_conservation
    dataset: lu177_adult_female
    expect: pass

  # ---- the quantity the scenario cares about: cross dose to the kidneys vs the EANM statement -----------
  - id: svalues.male.kidney_cross_share_vs_eanm
    kind: refdata
    name: anchored_cross_share
    dataset: lu177_adult_male
    target: kidneys
    organs:
      kidneys: {region: Kidneys, dose: staanum2021.dotatate.specific_dose.mean}
      liver: {region: Liver, dose: santoro2018.dose.liver}
      spleen: {region: Spleen, dose: santoro2018.dose.spleen}
    claim: gleisner2022.rest_of_body_share_kidney_dose
    abs_tol: 0.7
    expect: pass
    note: "Share of the anchored kidney dose that comes from liver and spleen, against 'about 2 %' in the EANM recommendations."
