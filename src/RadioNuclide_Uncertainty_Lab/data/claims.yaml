# Registry of published numbers used by this project, and the consistency checks that guard them.
#
# A *claim* is one number as printed in a source, with where to find it. Nothing here is derived
# by hand: derived quantities are computed by the checks or by the code that uses them.
# A *check* relates claims (or claims and physics) and is run by `check-data`, in CI and in tests.
#   expect: pass      the relation must hold; if it fails, the claims it lists are excluded
#   expect: conflict  a discrepancy in the source that we know about; the relation must keep
#                     failing (so a correction upstream is noticed) and the named claims are
#                     excluded from use until someone resolves it
# Excluded claims cannot be referenced by a config (`claim:` field) or fetched with `require()`.

version: 1

