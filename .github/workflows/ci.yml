name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      # published-data consistency: fails on any new discrepancy or on a known one being silently fixed
      - run: radionuclide-uncertainty-lab check-data

  # Guards against numpy/scipy releases changing statistical behaviour: tests use fixed seeds
  # and analytic benchmarks, so a failure here is a real signal rather than flakiness.
  latest-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" --upgrade --upgrade-strategy eager
      - run: pytest
