[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "RadioNuclide_Uncertainty_Lab"
version = "0.2.0"
description = "Uncertainty-aware nuclear medicine dosimetry: transparent Monte Carlo propagation, sensitivity rankings and error budgets for single- and multi-organ internal dosimetry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["dosimetry", "nuclear medicine", "uncertainty", "monte carlo", "sobol", "MIRD"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",   # scipy.stats.qmc (Sobol / Latin hypercube)
    "pyyaml>=6",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7"]

[project.scripts]
radionuclide-uncertainty-lab = "RadioNuclide_Uncertainty_Lab.cli:main"
rnulab = "RadioNuclide_Uncertainty_Lab.cli:main"   # short alias

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
RadioNuclide_Uncertainty_Lab = ["py.typed", "data/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
# the package name is deliberately mixed-case, as chosen by the project owner
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
# long YAML / CSV literals in tests and in the standalone extraction tool
"tests/*" = ["E501"]
"tools/*" = ["E501"]
